name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # The oldest Go that go.mod allows, and the newest.
        go: ["1.25.x", stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        if: matrix.go == 'stable'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "needs gofmt:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      - name: go test
        run: |
          set -o pipefail
          go test -race ./... 2>&1 | tee test.log
      # Surface the failing tests as an annotation, so they show on the commit
      # without digging through the job log.
      - name: annotate test failures
        if: failure()
        run: |
          summary=$(grep -E -e '--- FAIL|^FAIL|_test\.go:[0-9]+:|panic:' test.log | head -60)
          summary=${summary//'%'/'%25'}
          summary=${summary//$'\n'/'%0A'}
          echo "::error title=go test failed::${summary}"

  # Build every release artifact without publishing, so a broken packaging
  # config shows up here rather than when a tag is pushed.
  release-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: goreleaser/goreleaser-action@v7
        with:
          args: release --snapshot --clean
